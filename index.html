<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數學練習園地</title>
<style>
:root{--ink:#253044;--muted:#667085;--line:#d9e0ea;--blue:#3569d4;--bluebg:#eaf1ff}
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:850px;margin:0 auto;padding:28px 16px 44px}.hero{text-align:center;padding:30px 12px 24px}
.logo{width:76px;height:76px;border-radius:24px;background:var(--bluebg);display:grid;place-items:center;font-size:38px;margin:0 auto 16px}
h1{font-size:clamp(28px,6vw,40px);margin:0 0 10px}.hero p{margin:0 auto;color:var(--muted);line-height:1.8;max-width:540px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}
.card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:20px;padding:23px;text-decoration:none;color:inherit;min-height:260px;box-shadow:0 6px 20px #22334b08;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#9db5ef}.icon{font-size:32px;margin-bottom:16px}
.card h2{font-size:21px;line-height:1.45;margin:0 0 10px}.card p{font-size:14px;line-height:1.8;color:var(--muted);margin:0 0 18px}
.card .cta{margin-top:auto;display:inline-flex;align-items:center;gap:7px;color:var(--blue);font-weight:750}
.note{margin:18px 0 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--muted);font-size:13px;line-height:1.8}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
@media(max-width:620px){.cards{grid-template-columns:1fr}.card{min-height:220px}.hero{padding-top:18px}}
</style>
</head>
<body><main>
<section class="hero">
 <div class="logo" aria-hidden="true">🧮</div>
 <h1>數學練習園地</h1>
 <p>選擇今天要挑戰的題型。慢慢思考、一步一步推理，比急著寫出答案更重要！</p>
</section>
<section class="cards" aria-label="練習題型">
 <a class="card" href="four-digit-add-subtract.html">
  <div class="icon" aria-hidden="true">➕ ➖</div>
  <h2>不超過 10,000 的四位數加減法填空</h2>
  <p>每次隨機產生 50 題加法或減法，包含計時器、答題統計與 CSV 匯出。</p>
  <span class="cta">進入練習 <span aria-hidden="true">→</span></span>
 </a>
 <a class="card" href="three-digit-multiplication.html">
  <div class="icon" aria-hidden="true">✖️</div>
  <h2>三位數乘以一位數的乘法填空</h2>
  <p>每次隨機產生 50 題三位數乘以一位數的填空，包含計時器、錯題統計、顯示答案與 CSV 匯出。</p>
  <span class="cta">進入練習 <span aria-hidden="true">→</span></span>
 </a>
</section>
<div class="note"><strong>練習說明：</strong>兩種題型都會在每次開始時隨機產生 50 題，並提供作答計時與結果匯出。</div>
<footer>數學練習園地 · 適合國小階段的互動練習</footer>
</main></body></html>
